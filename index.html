<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHUARKARKA SERVICES - स्मार्ट कियोस्क</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #5c6b73; margin: 0; padding: 20px; color: #fff; text-align: center; }
        header h2 { background: #333; display: inline-block; padding: 10px 20px; border-radius: 8px; }
        .notice-bar { background: #ffcc00; color: #000; padding: 10px; font-weight: bold; border-radius: 5px; margin: 15px auto; width: 80%; }
        .status-badge { background: #28a745; padding: 5px 15px; border-radius: 20px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; max-width: 900px; margin: auto; }
        .card { background: #fff; color: #000; padding: 20px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); background: #f0f0f0; }
        .card .emoji { font-size: 30px; margin-bottom: 10px; }
        .card h4 { margin: 5px 0; font-size: 14px; }
        .admin-section { background: #343a40; padding: 20px; margin-top: 40px; border-radius: 10px; text-align: left; max-width: 800px; margin-left: auto; margin-right: auto; }
        .admin-section input, .admin-section textarea, .admin-section select { width: 100%; padding: 8px; margin: 5px 0 15px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        .toggle-btn { background: #ffc107; color: #000; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h2>🖨️ BHUARKARKA SERVICES 🙏</h2>
    </header>

    <div class="notice-bar" id="noticeText">लोड हो रहा है...</div>
    <div><span class="status-badge" id="shopStatus">🟢 दुकान खुली है (ONLINE)</span></div>

    <button class="btn toggle-btn" onclick="checkPassword()">⚙️ एडमिन पैनल खोलें</button>

    <h3>कृपया अपनी सेवा चुनें:</h3>
    <div class="services-grid" id="servicesContainer">
        <!-- कार्ड्स यहाँ लोड होंगे -->
    </div>

    <!-- एडमिन पैनल (शुरुआत में छिपा रहेगा) -->
    <div class="admin-section" id="adminPanel" style="display:none;">
        <h3>🔒 एडमिन पैनल</h3>
        
        <label>होमपेज नोटिस अपडेट करें:</label>
        <textarea id="adminNotice"></textarea>
        
        <label>दुकान की स्थिति (Status):</label>
        <select id="adminStatus">
            <option value="ONLINE">ONLINE (खुली है)</option>
            <option value="OFFLINE">OFFLINE (बंद है)</option>
        </select>
        <button class="btn" onclick="updateSettings()">सेटिंग्स सेव करें</button>

        <hr style="margin: 20px 0;">

        <h4>➕ नया सर्विस कार्ड जोड़ें:</h4>
        <label>इमोजी (Emoji):</label>
        <input type="text" id="addEmoji" placeholder="जैसे: 📄">
        
        <label>कार्ड टाइटल:</label>
        <input type="text" id="addTitle" placeholder="जैसे: AADHAR DOWNLOAD">
        
        <label>फीस (₹):</label>
        <input type="number" id="addFees" value="0">
        
        <label>एक्सटर्नल लिंक / URL (वैकल्पिक):</label>
        <input type="text" id="addLink" placeholder="https://...">

        <button class="btn" onclick="addNewService()">नया कार्ड जोड़ें</button>
    </div>

    <script>
        const API_URL = "यहाँ_अपना_गूगल_ऐप_स्क्रिप्ट_यूआरएल_डालें"; // <--- यहाँ अपना सही यूआरएल डालें
        const ADMIN_PASSWORD = "1234"; // <--- यहाँ अपना मनपसंद पासवर्ड सेट कर सकते हैं

        async function loadData() {
            try {
                let response = await fetch(API_URL + "?action=getData");
                let data = await response.json();
                
                document.getElementById("noticeText").innerText = "📢 " + data.notice;
                document.getElementById("adminNotice").value = data.notice;
                document.getElementById("shopStatus").innerText = data.status === "ONLINE" ? "🟢 दुकान खुली है (ONLINE)" : "🔴 दुकान बंद है (OFFLINE)";

                let container = document.getElementById("servicesContainer");
                container.innerHTML = "";
                
                if(data.services) {
                    data.services.forEach(service => {
                        let card = document.createElement("div");
                        card.className = "card";
                        card.innerHTML = `
                            <div class="emoji">${service.emoji || '📄'}</div>
                            <h4>${service.title}</h4>
                            <p style="font-size:12px; color:green;"><b>₹${service.fees}</b></p>
                        `;
                        card.onclick = () => {
                            if(service.link) {
                                window.open(service.link, "_blank");
                            } else {
                                alert(service.note || "यह सेवा उपलब्ध है।");
                            }
                        };
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        function checkPassword() {
            let pass = prompt("कृपया एडमिन पासवर्ड दर्ज करें:");
            if (pass === ADMIN_PASSWORD) {
                let panel = document.getElementById("adminPanel");
                if (panel.style.display === "none") {
                    panel.style.display = "block";
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                } else {
                    panel.style.display = "none";
                }
            } else if (pass !== null) {
                alert("गलत पासवर्ड! एक्सेस अस्वीकृत।");
            }
        }

        async function updateSettings() {
            let notice = document.getElementById("adminNotice").value;
            let status = document.getElementById("adminStatus").value;
            let url = `${API_URL}?action=updateSettings&notice=${encodeURIComponent(notice)}&status=${status}`;
            
            let res = await fetch(url);
            let result = await res.json();
            alert("सेटिंग्स अपडेट हो गई!");
            loadData();
        }

        async function addNewService() {
            let emoji = document.getElementById("addEmoji").value;
            let title = document.getElementById("addTitle").value;
            let fees = document.getElementById("addFees").value;
            let link = document.getElementById("addLink").value;

            let url = `${API_URL}?action=addService&emoji=${encodeURIComponent(emoji)}&title=${encodeURIComponent(title)}&fees=${fees}&link=${encodeURIComponent(link)}`;
            
            let res = await fetch(url);
            let result = await res.json();
            alert("नया सर्विस कार्ड सफलतापूर्वक जुड़ गया!");
            location.reload();
        }

        loadData();
    </script>
</body>
</html>
