<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHUARKARKA SERVICES - स्मार्ट कियोस्क</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #5c6b73; margin: 0; padding: 15px; color: #fff; text-align: center; }
        .admin-link { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.4); color: #fff; text-decoration: none; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 16px; z-index: 1000; transition: 0.3s; }
        .admin-link:hover { background: rgba(0,0,0,0.8); }

        header h2 { background: #333; display: inline-block; padding: 10px 20px; border-radius: 8px; font-size: 20px; margin-top: 10px; }
        .notice-bar { background: #ffcc00; color: #000; padding: 10px; font-weight: bold; border-radius: 5px; margin: 15px auto; width: 95%; max-width: 650px; font-size: 14px; }
        .status-badge { background: #28a745; padding: 5px 15px; border-radius: 20px; display: inline-block; font-weight: bold; margin-bottom: 20px; font-size: 14px; }
        
        /* विज्ञापन और सोशल मीडिया बैनर बॉक्स (जब तक एडमिन न जोड़े, तब तक नहीं दिखेगा) */
        .ad-banner { background: #fff; color: #333; max-width: 650px; margin: 0 auto 20px auto; padding: 15px; border-radius: 8px; box-shadow: 0 3px 6px rgba(0,0,0,0.3); text-align: left; display: none; }
        .ad-banner img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .social-icons { margin-top: 10px; display: flex; gap: 10px; }
        .social-icons a { padding: 6px 12px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .social-icons a.yt { background: #ff0000; }
        .social-icons a.ig { background: #e1306c; }
        .social-icons a.fb { background: #1877f2; }

        /* सर्विस कार्ड्स ग्रिड लेआउट */
        .services-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 12px; 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 0 10px;
        }
        .card { 
            background: #fff; 
            color: #000; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.3); 
            display: flex; 
            align-items: center; 
            text-align: left; 
            transition: 0.3s; 
        }
        .card:hover { background: #f0f0f0; transform: translateY(-2px); }
        .card .emoji { font-size: 24px; margin-right: 12px; min-width: 32px; text-align: center; }
        .card-info { flex-grow: 1; }
        .card h4 { margin: 0 0 3px 0; font-size: 14px; color: #333; }
        .card p { margin: 0; font-size: 12px; color: #28a745; font-weight: bold; }

        /* सर्विस फॉर्म व्यू */
        .service-form-container {
            display: none;
            background: #fff;
            color: #333;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .service-form-container h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        .info-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 5px; font-size: 13px; margin-bottom: 15px; color: #856404; }
        .fee-box { padding: 10px; text-align: center; font-weight: bold; border-radius: 5px; margin-bottom: 12px; }
        .service-form-container label { font-size: 13px; font-weight: bold; display: block; margin-top: 10px; color: #333; }
        .service-form-container input, .service-form-container select, .service-form-container textarea {
            width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 13px;
        }
        .btn-submit { background: #28a745; color: white; border: none; padding: 11px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; font-size: 15px; }
        .btn-submit:hover { background: #218838; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #007BFF; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <a href="admin.html" class="admin-link" title="Admin Panel">⚙️</a>

    <header>
        <h2>🖨️ BHUARKARKA SERVICES 🙏</h2>
    </header>

    <div class="notice-bar" id="noticeText">📢 लोड हो रहा है...</div>
    <div><span class="status-badge" id="shopStatus">🟢 दुकान खुली है (ONLINE)</span></div>

    <!-- विज्ञापन और सोशल मीडिया बैनर (यदि एडमिन जोड़ेगा तभी दिखेगा) -->
    <div class="ad-banner" id="adBannerBox">
        <img id="adImg" src="" alt="Shop Ad" style="display:none;">
        <p id="adDescText" style="margin: 0; font-size: 13px; font-weight: bold;"></p>
        <div class="social-icons" id="socialLinksBox"></div>
    </div>

    <!-- होमपेज मुख्य कंटेनर -->
    <div id="homeContainer">
        <h3 style="font-size: 16px; margin-bottom: 15px;">कृपया अपनी सेवा चुनें (24x7 उपलब्ध):</h3>
        <div class="services-container" id="servicesContainer">
            <!-- कार्ड्स यहाँ लोड होंगे -->
        </div>
    </div>

    <!-- सर्विस फॉर्म व्यू -->
    <div class="service-form-container" id="serviceFormView">
        <h3 id="formServiceTitle">सर्विस का नाम</h3>
        <div class="info-box" id="formServiceNote"></div>
        <div id="formFeeBox"></div>
        <div id="formDownloadSection"></div>

        <form id="dynamicSubmitForm" onsubmit="submitServiceForm(event)">
            <input type="hidden" id="inputServiceType">
            <input type="hidden" id="inputAmount">

            <label>आवेदक का पूरा नाम:</label>
            <input type="text" id="custName" placeholder="पूरा नाम दर्ज करें" required>

            <label>मोबाइल नंबर:</label>
            <input type="text" id="custMobile" placeholder="मोबाइल नंबर दर्ज करें" required>

            <label>जीमेल (Email):</label>
            <input type="text" id="custEmail" value="NA" placeholder="email@gmail.com">

            <label>आवश्यक जानकारी / विवरण:</label>
            <input type="text" id="extraInfo" placeholder="विवरण दर्ज करें" required>

            <label>दस्तावेज / फाइल अपलोड करें:</label>
            <input type="file" id="serviceFiles" accept=".pdf,.jpg,.jpeg,.png,.jfif" multiple required style="background:#f9f9f9; padding:5px;">

            <div id="paymentSection" style="display:none;">
                <hr style="border:0; border-top:1px dashed #ccc; margin:15px 0;">
                <div style="text-align:center;">
                    <p style="font-size:12px; font-weight:bold; color:#555; margin:5px 0;">QR कोड स्कैन करके भुगतान करें:</p>
                    <img id="upiQrImg" src="" alt="UPI QR Code" style="width:150px; height:150px; border:1px solid #ddd; padding:4px; border-radius:5px;">
                    <p style="font-size:11px; color:#666; margin:4px 0;">UPI ID: <b>Q508475385@ybl</b></p>
                </div>
                <label>UPI ट्रांजैक्शन / UTR नंबर दर्ज करें:</label>
                <input type="text" id="utrNumber" placeholder="जैसे: 4321xxxxxxxx" style="background:#fffde7; font-weight:bold;">
            </div>

            <button type="submit" class="btn-submit" id="submitBtnText">🚀 फॉर्म सबमिट करें</button>
        </form>
        <a href="#" class="btn-back" onclick="goHome(event)">⬅️ होम पेज पर जाएं</a>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyvPw32Gc1Qz8Qkr_POUAcnjLhJUJy8ej5DWoz39eiWETIEjCrz-I21qQjUgsX5Gt4O/exec";

        const defaultServices = [
            { title: "SELF PRINT", fees: 0, emoji: "📄", note: "जरूरी दस्तावेज: प्रिंट करने वाली फाइल (PDF/JPG)." },
            { title: "मूल निवास प्रमाण पत्र", fees: 0, emoji: "📜", note: "जरूरी दस्तावेज: आधार कार्ड, जन आधार, राशन कार्ड और पुराना मूल निवास।" },
            { title: "जाति प्रमाण पत्र", fees: 0, emoji: "📑", note: "जरूरी दस्तावेज: आधार कार्ड, स्व-घोषणा पत्र और मूल निवास।" },
            { title: "PAN CARD", fees: 200, emoji: "💳", note: "जरूरी दस्तावेज: आधार कार्ड, पासपोर्ट साइज फोटो और मोबाइल नंबर।" },
            { title: "PVC AADHAR", fees: 100, emoji: "🪪", note: "जरूरी दस्तावेज: आधार नंबर और रजिस्टर्ड मोबाइल नंबर।" },
            { title: "VOTER CARD", fees: 100, emoji: "🗳️", note: "जरूरी दस्तावेज: पुराना वोटर कार्ड या आधार कार्ड।" },
            { title: "FARMER ID", fees: 100, emoji: "🌽", note: "जरूरी दस्तावेज: खसरा-खतौनी, आधार कार्ड और बैंक पासबुक।" },
            { title: "SHRAMIK CARD", fees: 200, emoji: "👷", note: "जरूरी दस्तावेज: जन आधार, बैंक पासबुक और काम करने का प्रमाण पत्र।" },
            { title: "JAN AADHAAR", fees: 50, emoji: "🆔", note: "जरूरी दस्तावेज: सभी सदस्यों के आधार कार्ड।" },
            { title: "JAN AADHAAR PVC", fees: 100, emoji: "🪪", note: "जरूरी दस्तावेज: जन आधार नंबर।" },
            { title: "AYUSHMAN CARD", fees: 100, emoji: "🏥", note: "जरूरी दस्तावेज: आधार कार्ड और राशन कार्ड।" }
        ];

        async function loadData() {
            try {
                let response = await fetch(API_URL + "?action=getData");
                let data = await response.json();
                
                document.getElementById("noticeText").innerText = "📢 " + (data.notice || "स्वागत है!");
                document.getElementById("shopStatus").innerText = data.status === "ONLINE" ? "🟢 दुकान खुली है (ONLINE)" : "🔴 दुकान बंद है (OFFLINE)";

                // विज्ञापन और सोशल मीडिया बैनर दिखाना (यदि उपलब्ध हो)
                if (data.ad && (data.ad.desc || data.ad.photoUrl || data.ad.youtube || data.ad.instagram || data.ad.facebook)) {
                    let bannerBox = document.getElementById("adBannerBox");
                    bannerBox.style.display = "block";
                    
                    let imgTag = document.getElementById("adImg");
                    if(data.ad.photoUrl) {
                        imgTag.src = data.ad.photoUrl;
                        imgTag.style.display = "block";
                    }

                    document.getElementById("adDescText").innerText = data.ad.desc || "";

                    let socialBox = document.getElementById("socialLinksBox");
                    socialBox.innerHTML = "";
                    if(data.ad.youtube) socialBox.innerHTML += `<a href="${data.ad.youtube}" target="_blank" class="yt">▶ YouTube</a>`;
                    if(data.ad.instagram) socialBox.innerHTML += `<a href="${data.ad.instagram}" target="_blank" class="ig">📸 Instagram</a>`;
                    if(data.ad.facebook) socialBox.innerHTML += `<a href="${data.ad.facebook}" target="_blank" class="fb">📘 Facebook</a>`;
                }

                let container = document.getElementById("servicesContainer");
                container.innerHTML = "";
                
                let servicesList = (data.services && data.services.length > 0) ? data.services : defaultServices;

                servicesList.forEach(service => {
                    let card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="emoji">${service.emoji || '📄'}</div>
                        <div class="card-info">
                            <h4>${service.title}</h4>
                            <p>${service.fees > 0 ? '₹' + service.fees : 'FREE'}</p>
                        </div>
                    `;
                    card.onclick = () => openServiceForm(service);
                    container.appendChild(card);
                });
            } catch (error) {
                let container = document.getElementById("servicesContainer");
                container.innerHTML = "";
                defaultServices.forEach(service => {
                    let card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="emoji">${service.emoji}</div>
                        <div class="card-info">
                            <h4>${service.title}</h4>
                            <p>${service.fees > 0 ? '₹' + service.fees : 'FREE'}</p>
                        </div>
                    `;
                    card.onclick = () => openServiceForm(service);
                    container.appendChild(card);
                });
            }
        }

        function openServiceForm(service) {
            document.getElementById("homeContainer").style.display = "none";
            let formView = document.getElementById("serviceFormView");
            formView.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById("formServiceTitle").innerText = (service.emoji || '📄') + " " + service.title;
            document.getElementById("inputServiceType").value = service.title;
            document.getElementById("inputAmount").value = service.fees || 0;

            let noteBox = document.getElementById("formServiceNote");
            noteBox.innerHTML = "<b>📌 जरूरी दस्तावेज व निर्देश:</b> " + (service.note || "आवश्यक दस्तावेज अपलोड करें।");

            let downloadSec = document.getElementById("formDownloadSection");
            if (service.fileUrl) {
                downloadSec.innerHTML = `<a href="${service.fileUrl}" target="_blank" style="display:block; background:#2980b9; color:white; text-align:center; padding:10px; font-weight:bold; border-radius:5px; text-decoration:none; margin-bottom:15px;">📥 फॉर्म / संबंधित फाइल डाउनलोड करें</a>`;
            } else {
                downloadSec.innerHTML = "";
            }

            let feeBox = document.getElementById("formFeeBox");
            let paymentSec = document.getElementById("paymentSection");
            let fees = parseInt(service.fees || 0);

            if (fees > 0) {
                feeBox.className = "fee-box";
                feeBox.style.background = "#e8f5e9";
                feeBox.style.color = "#2e7d32";
                feeBox.innerText = "देय फीस (Fee): ₹" + fees;
                
                document.getElementById("upiQrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=Q508475385@ybl&pn=BHUARKARKA%20SERVICES&am=${fees}&cu=INR`;
                paymentSec.style.display = "block";
                document.getElementById("utrNumber").required = true;
                document.getElementById("submitBtnText").innerText = "🚀 भुगतान सत्यापित करें व फॉर्म जमा करें";
            } else {
                feeBox.className = "fee-box";
                feeBox.style.background = "#e3f2fd";
                feeBox.style.color = "#1565c0";
                feeBox.innerText = "🎉 यह सेवा बिल्कुल मुफ़्त (FREE) है!";
                paymentSec.style.display = "none";
                document.getElementById("utrNumber").required = false;
                document.getElementById("submitBtnText").innerText = "🚀 फ़ॉर्म सबमिट करें";
            }
        }

        function goHome(e) {
            e.preventDefault();
            document.getElementById("serviceFormView").style.display = "none";
            document.getElementById("homeContainer").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitServiceForm(e) {
            e.preventDefault();
            let serviceType = document.getElementById("inputServiceType").value;
            let amount = document.getElementById("inputAmount").value;
            let custName = document.getElementById("custName").value;
            let custMobile = document.getElementById("custMobile").value;
            let custEmail = document.getElementById("custEmail").value;
            let extraInfo = document.getElementById("extraInfo").value;
            let utrNumber = document.getElementById("utrNumber").value || "FREE / NA";
            let fileInput = document.getElementById("serviceFiles");

            if (fileInput.files.length === 0) {
                alert("कृपया कम से कम एक दस्तावेज अपलोड करें!");
                return;
            }

            alert("डेटा और फाइलें अपलोड हो रही हैं, कृपया प्रतीक्षा करें...");

            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                let base64Data = reader.result.split(',')[1];
                
                let payload = {
                    sheetName: "New",
                    cust_name: custName,
                    cust_mobile: custMobile,
                    cust_email: custEmail,
                    service_type: serviceType,
                    amount: amount,
                    filenames: `विवरण: ${extraInfo} | फाइल: ${file.name}`,
                    fileData: base64Data,
                    fileName: file.name,
                    utr: utrNumber,
                    status: "Pending (पेंडिंग)"
                };

                try {
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });

                    document.getElementById("serviceFormView").innerHTML = `
                        <div style="text-align:center; padding:20px;">
                            <h2 style="color:#28a745;">✅ आवेदन सफलतापूर्वक जमा हो गया!</h2>
                            <p style="font-size:14px; color:#333;">आपका डेटा और फाइलें सुरक्षित रूप से एडमिन पैनल तक पहुँच गई हैं।</p>
                            <br><a href="index.html" style="display:inline-block; padding:10px 20px; background:#007BFF; color:white; text-decoration:none; border-radius:5px; font-weight:bold;">🏠 होम पेज पर जाएं</a>
                        </div>
                    `;
                } catch (err) {
                    alert("सबमिट करने में त्रुटि हुई। कृपया पुनरावृत्ति करें।");
                }
            };
        }

        window.onload = loadData;
    </script>
</body>
</html>
