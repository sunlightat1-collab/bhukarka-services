<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHUARKARKA SERVICES - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; margin: 0; padding: 15px; color: #fff; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #34495e; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 20px; color: #f39c12; }
        .back-btn { background: #e74c3c; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        
        .control-panel { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .control-box label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #ecf0f1; }
        .control-box input, .control-box select { width: 100%; padding: 8px; border: 1px solid #7f8c8d; border-radius: 4px; box-sizing: border-box; background: #fff; color: #333; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-save:hover { background: #219653; }

        .table-container { background: #fff; color: #333; border-radius: 8px; overflow-x: auto; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #f1f1f1; color: #2c3e50; }
        tr:hover { background: #f9f9f9; }
        .file-link { color: #2980b9; font-weight: bold; text-decoration: none; }
        .file-link:hover { text-decoration: underline; }
        .loading { text-align: center; padding: 20px; font-size: 16px; color: #666; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛠️ एडमिन कंट्रोल पैनल (Bhuarkarka Services)</h2>
        <a href="index.html" class="back-btn">🏠 होम पेज पर जाएं</a>
    </div>

    <!-- सेटिंग्स और दुकान कंट्रोल -->
    <div class="control-panel">
        <div class="control-box">
            <label>📢 मुख्य पेज का नोटिस बदलें:</label>
            <input type="text" id="adminNotice" placeholder="नोटिस यहाँ लिखें...">
        </div>
        <div class="control-box">
            <label>🟢 दुकान की स्थिति (Status):</label>
            <select id="adminStatus">
                <option value="ONLINE">दुकान खुली है (ONLINE)</option>
                <option value="OFFLINE">दुकान बंद है (OFFLINE)</option>
            </select>
        </div>
        <div class="control-box" style="display: flex; align-items: flex-end;">
            <button class="btn-save" onclick="updateSettings()">💾 सेटिंग्स सेव करें</button>
        </div>
    </div>

    <!-- ग्राहकों के डेटा की टेबल -->
    <div class="table-container">
        <h3 style="margin-top:0; color:#2c3e50;">📥 प्राप्त आवेदन और दस्तावेज लिस्ट:</h3>
        <div id="loadingText" class="loading">डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...</div>
        <table id="submissionsTable" style="display:none;">
            <thead>
                <tr>
                    <th>दिनांक / समय</th>
                    <th>आवेदक का नाम</th>
                    <th>मोबाइल नंबर</th>
                    <th>चुनी गई सर्विस</th>
                    <th>फीस & UTR नंबर</th>
                    <th>विवरण / फाइल</th>
                    <th>स्थिति (Status)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- डेटा यहाँ जावास्क्रिप्ट से जुड़ेगा -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyvPw32Gc1Qz8Qkr_POUAcnjLhJUJy8ej5DWoz39eiWETIEjCrz-I21qQjUgsX5Gt4O/exec";

        async function loadAdminData() {
            try {
                let response = await fetch(API_URL + "?action=getAdminData");
                let data = await response.json();

                // नोटिस और स्टेटस भरें
                document.getElementById("adminNotice").value = data.notice || "";
                document.getElementById("adminStatus").value = data.status || "ONLINE";

                let tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";

                if (data.submissions && data.submissions.length > 0) {
                    data.submissions.reverse().forEach(sub => {
                        let row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${sub.date || 'NA'}</td>
                            <td><b>${sub.cust_name || 'NA'}</b></td>
                            <td>${sub.cust_mobile || 'NA'}</td>
                            <td><span style="background:#eef2f3; padding:3px 6px; border-radius:4px; font-weight:bold;">${sub.service_type || 'NA'}</span></td>
                            <td>फीस: ₹${sub.amount || 0}<br><small style="color:#d35400;">UTR: ${sub.utr || 'NA'}</small></td>
                            <td>${sub.filenames || 'NA'}</td>
                            <td><span style="color:green; font-weight:bold;">${sub.status || 'Pending'}</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#7f8c8d;">अभी कोई नया आवेदन प्राप्त नहीं हुआ है।</td></tr>`;
                }

                document.getElementById("loadingText").style.display = "none";
                document.getElementById("submissionsTable").style.display = "table";

            } catch (err) {
                document.getElementById("loadingText").innerText = "डेटा लोड करने में त्रुटि हुई। कृपया API लिंक चेक करें।";
            }
        }

        async function updateSettings() {
            let notice = document.getElementById("adminNotice").value;
            let status = document.getElementById("adminStatus").value;

            alert("सेटिंग्स सेव की जा रही हैं...");

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        sheetName: "Settings",
                        notice: notice,
                        status: status
                    })
                });
                alert("✅ सेटिंग्स सफलतापूर्वक अपडेट हो गई हैं!");
                loadAdminData();
            } catch (error) {
                alert("सेटिंग्स सेव करने में असफल।");
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
