<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल - BHUARKARKA SERVICES</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #343a40; margin: 0; padding: 15px; color: #fff; text-align: center; }
        .login-box, .admin-container { max-width: 600px; margin: 20px auto; background: #212529; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: left; }
        h2 { color: #ffc107; text-align: center; margin-top: 0; }
        label { font-size: 13px; font-weight: bold; color: #ffc107; display: block; margin-top: 12px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ced4da; box-sizing: border-box; font-size: 14px; color: #000; background: #fff; }
        .btn { background: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 15px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .home-link { display: inline-block; margin-bottom: 20px; color: #17a2b8; text-decoration: none; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #444; margin: 25px 0; }
    </style>
</head>
<body>

    <div style="max-width: 600px; margin: 0 auto; text-align: left;">
        <a href="index.html" class="home-link">⬅️ कियोस्क होमपेज पर जाएं</a>
    </div>

    <!-- पासवर्ड लॉगिन स्क्रीन -->
    <div class="login-box" id="loginScreen">
        <h2>🔒 एडमिन लॉगिन</h2>
        <label>पासवर्ड दर्ज करें:</label>
        <input type="password" id="adminPasswordInput" placeholder="पासवर्ड लिखें...">
        <button class="btn" onclick="verifyAdminPassword()">लॉगइन करें</button>
    </div>

    <!-- मुख्य एडमिन पैनल -->
    <div class="admin-container" id="adminPanel" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>⚙️ एडमिन कंट्रोल पैनल</h2>
            <button class="btn btn-danger" style="width: auto; padding: 6px 12px; margin:0; font-size: 12px;" onclick="adminLogout()">लॉगआउट</button>
        </div>
        
        <label>होमपेज नोटिस अपडेट करें:</label>
        <textarea id="adminNotice" rows="2"></textarea>
        
        <label>दुकान की स्थिति (Status):</label>
        <select id="adminStatus">
            <option value="ONLINE">ONLINE (खुली है)</option>
            <option value="OFFLINE">OFFLINE (बंद है)</option>
        </select>

        <button class="btn" onclick="updateSettings()">सेटिंग्स सेव करें</button>

        <hr>

        <h3 style="color:#ffc107; font-size: 16px; margin-top:0;">➕ नया 24x7 सर्विस कार्ड जोड़ें:</h3>
        
        <label>इमोजी (Emoji):</label>
        <input type="text" id="addEmoji" placeholder="जैसे: 📄">
        
        <label>कार्ड टाइटल (Service Name):</label>
        <input type="text" id="addTitle" placeholder="जैसे: Pan Card Apply">

        <label>फीस (₹):</label>
        <input type="number" id="addFees" value="0">

        <label>जरूरी दस्तावेज और जानकारी (Required Docs / Instructions):</label>
        <textarea id="addNote" rows="3" placeholder="जैसे: आधार कार्ड, पासपोर्ट साइज फोटो और मोबाइल नंबर जरूरी है।"></textarea>
        
        <label>फॉर्म / प्रपत्र अपलोड करें (PDF/Image - वैकल्पिक):</label>
        <input type="file" id="addFile" style="background:#fff;">

        <label>या एक्सटर्नल लिंक / URL (वैकल्पिक):</label>
        <input type="text" id="addLink" placeholder="https://...">

        <button class="btn" style="background: #28a745;" onclick="addNewService()">24x7 परमानेंट कार्ड जोड़ें</button>

        <hr>

        <h3 style="color:#ffc107; font-size: 16px; margin-top:0;">📢 विज्ञापन एवं सोशल मीडिया प्रोफाइल सेटअप:</h3>
        
        <label>दुकान की प्रोफाइल फोटो (Shop Banner/Logo):</label>
        <input type="file" id="adPhoto" style="background:#fff;">

        <label>विज्ञापन / दुकान का विवरण (Description):</label>
        <textarea id="adDesc" rows="3" placeholder="अपनी दुकान या स्पेशल ऑफर के बारे में यहाँ लिखें..."></textarea>

        <label>YouTube चैनल लिंक:</label>
        <input type="text" id="adYoutube" placeholder="https://youtube.com/...">

        <label>Instagram पेज लिंक:</label>
        <input type="text" id="adInstagram" placeholder="https://instagram.com/...">

        <label>Facebook प्रोफाइल लिंक:</label>
        <input type="text" id="adFacebook" placeholder="https://facebook.com/...">

        <button class="btn" style="background: #17a2b8;" onclick="saveAdvertisement()">विज्ञापन और प्रोफाइल सेव करें</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyvPw32Gc1Qz8Qkr_POUAcnjLhJUJy8ej5DWoz39eiWETIEjCrz-I21qQjUgsX5Gt4O/exec";
        const ADMIN_PASSWORD = "7615";

        window.onload = function() {
            if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                fetchCurrentSettings();
            }
        };

        function verifyAdminPassword() {
            let pass = document.getElementById("adminPasswordInput").value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminLoggedIn", "true");
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                fetchCurrentSettings();
            } else {
                alert("गलत पासवर्ड!");
            }
        }

        function adminLogout() {
            sessionStorage.removeItem("isAdminLoggedIn");
            location.reload();
        }

        async function fetchCurrentSettings() {
            try {
                let res = await fetch(API_URL + "?action=getData");
                let data = await res.json();
                document.getElementById("adminNotice").value = data.notice || "";
                document.getElementById("adminStatus").value = data.status || "ONLINE";
                if(data.ad) {
                    document.getElementById("adDesc").value = data.ad.desc || "";
                    document.getElementById("adYoutube").value = data.ad.youtube || "";
                    document.getElementById("adInstagram").value = data.ad.instagram || "";
                    document.getElementById("adFacebook").value = data.ad.facebook || "";
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function updateSettings() {
            let notice = document.getElementById("adminNotice").value;
            let status = document.getElementById("adminStatus").value;
            let url = `${API_URL}?action=updateSettings&notice=${encodeURIComponent(notice)}&status=${status}`;
            await fetch(url);
            alert("सेटिंग्स सफलतापूर्वक अपडेट हो गई!");
        }

        async function addNewService() {
            let emoji = document.getElementById("addEmoji").value;
            let title = document.getElementById("addTitle").value;
            let fees = document.getElementById("addFees").value;
            let note = document.getElementById("addNote").value;
            let link = document.getElementById("addLink").value;
            let fileInput = document.getElementById("addFile");

            if (!title) {
                alert("कृपया कार्ड का टाइटल भरें!");
                return;
            }

            let payload = {
                action: "addService",
                emoji: emoji,
                title: title,
                fees: fees,
                note: note,
                link: link
            };

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async function () {
                    payload.fileName = file.name;
                    payload.fileData = reader.result.split(',')[1];
                    alert("डेटा अपलोड हो रहा है...");
                    await sendToServer(payload);
                };
            } else {
                alert("डेटा सेव हो रहा है...");
                await sendToServer(payload);
            }
        }

        async function saveAdvertisement() {
            let desc = document.getElementById("adDesc").value;
            let youtube = document.getElementById("adYoutube").value;
            let instagram = document.getElementById("adInstagram").value;
            let facebook = document.getElementById("adFacebook").value;
            let photoInput = document.getElementById("adPhoto");

            let adData = {
                action: "saveAd",
                desc: desc,
                youtube: youtube,
                instagram: instagram,
                facebook: facebook
            };

            if (photoInput.files.length > 0) {
                let file = photoInput.files[0];
                let reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async function () {
                    adData.photoName = file.name;
                    adData.photoData = reader.result.split(',')[1];
                    alert("विज्ञापन और फोटो अपलोड हो रही है...");
                    await sendToServer(adData);
                };
            } else {
                alert("विज्ञापन सेव हो रहा है...");
                await sendToServer(adData);
            }
        }

        async function sendToServer(payload) {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                alert("सफलतापूर्वक सेव हो गया!");
                location.reload();
            } catch (err) {
                alert("त्रुटि हुई। कृपया पुनः प्रयास करें।");
            }
        }
    </script>
</body>
</html>
